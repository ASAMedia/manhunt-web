<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <title>Manhunt</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="center-page start-page">
  <main class="stack">
    <div class="lang-corner" id="langSlot"></div>
    <header class="brand small">
      <img class="brand-logo" src="/icon.svg" alt="" width="52" height="52">
      <div class="kicker" data-i18n="join.joining">Du trittst bei</div>
      <h1 id="roomName">Manhunt</h1>
    </header>
    <ol class="progress-steps">
      <li class="done" data-i18n="step.1">Code</li>
      <li class="current" aria-current="step" data-i18n="step.2">Name</li>
      <li data-i18n="step.3">Loslegen</li>
    </ol>
    <p id="info" class="muted" style="text-align:center" data-i18n="join.loading">Lade Spiel …</p>
    <form id="joinForm" class="card stack hidden">
      <label class="field" for="name" data-i18n="join.nameLabel">Dein Name – bei Jäger-Teams der Teamname</label>
      <input id="name" class="big-input" maxlength="24" autocomplete="nickname" required>
      <button class="btn primary big" type="submit" data-i18n="join.submit">Mitspielen</button>
      <p id="err" class="error"></p>
      <p class="small muted">
        <span data-i18n="join.privacy">Während des Spiels wird dein Standort an die Spielleitung übertragen.</span>
        <a href="/datenschutz" data-i18n="join.privacyLink">Was passiert mit meinen Daten?</a>
      </p>
    </form>
    <p style="text-align:center"><a class="small muted" href="/" data-i18n="join.otherCode">Anderen Code eingeben</a></p>
  </main>
  <script type="module" src="/join.js"></script>
</body>
</html>
