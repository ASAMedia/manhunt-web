<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d13b3b">
  <title>Manhunt</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="center-page start-page">
  <main class="stack">
    <div class="lang-corner" id="langSlot"></div>
    <header class="brand">
      <img class="brand-logo" src="/icon.svg" alt="" width="76" height="76">
      <h1>Manhunt</h1>
      <p class="tagline" data-i18n="idx.tagline">Das Fangspiel durch die Stadt</p>
    </header>
    <a id="resume" class="btn primary big hidden" href="/play"></a>
    <form id="codeForm" class="card stack">
      <label class="field" for="code" data-i18n="idx.code">Spielcode</label>
      <input id="code" class="code-input" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123" required>
      <button class="btn primary big" type="submit" data-i18n="idx.join">Beitreten</button>
    </form>
    <ol class="how-steps">
      <li><span class="step-n" aria-hidden="true">1</span><div><strong data-i18n="idx.s1t">QR-Code scannen</strong><span class="small muted" data-i18n="idx.s1">oder oben den Code der Spielleitung eingeben</span></div></li>
      <li><span class="step-n" aria-hidden="true">2</span><div><strong data-i18n="idx.s2t">Namen eingeben</strong><span class="small muted" data-i18n="idx.s2">bei Jäger-Teams den Teamnamen</span></div></li>
      <li><span class="step-n" aria-hidden="true">3</span><div><strong data-i18n="idx.s3t">Standort freigeben &amp; loslegen</strong><span class="small muted" data-i18n="idx.s3">Seite offen lassen, Display an</span></div></li>
    </ol>
    <p style="text-align:center" class="small">
      <a class="muted" href="/datenschutz" data-i18n="common.privacy">Datenschutz</a> ·
      <a class="muted" href="/admin" data-i18n="idx.admin">Spielleitung</a>
    </p>
  </main>
  <script type="module" src="/index.js"></script>
</body>
</html>
