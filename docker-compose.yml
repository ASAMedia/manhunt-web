# Auf dem Server reichen diese Datei und eine .env (siehe .env.example).
# Das Image wird fertig von GitHub geladen (ghcr.io); lokal mit Quellcode baut
# docker-compose.override.yml es stattdessen selbst.
#
# Welche Zusatzdienste laufen, steht in der .env unter COMPOSE_PROFILES, z. B.
#   COMPOSE_PROFILES=caddy,autoupdate
# Dann genügt immer:  docker compose pull && docker compose up -d
#
#   caddy       eigene Domain mit automatischem HTTPS (Ports 80/443)
#   tunnel      kostenloser Cloudflare-Schnelltunnel ohne Domain (Adresse: docker compose logs tunnel)
#   autoupdate  holt neue Versionen automatisch, täglich um 4 Uhr nachts
# Ohne Profil läuft nur die App auf http://127.0.0.1:3000 (z. B. hinter einem vorhandenen Reverse Proxy).

services:
  app:
    image: ${MANHUNT_IMAGE:-ghcr.io/asamedia/manhunt-web:latest}
    restart: unless-stopped
    init: true
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Bitte ADMIN_PASSWORD in .env setzen}
      SUPERVISOR_PASSWORD: ${SUPERVISOR_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAP_CENTER: ${MAP_CENTER:-}
      TILE_URL: ${TILE_URL:-}
      TILE_ATTRIBUTION: ${TILE_ATTRIBUTION:-}
      AUTO_DELETE_DAYS: ${AUTO_DELETE_DAYS:-7}
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
      TILE_PROXY: ${TILE_PROXY:-1}
      TRUST_PROXY: "1"
    labels:
      # nur diesen Container automatisch aktualisieren (Profil autoupdate)
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - manhunt-data:/data
    ports:
      - "127.0.0.1:${LOCAL_PORT:-3000}:3000"

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    # Automatisches HTTPS (Let's Encrypt) für DOMAIN, leitet an die App weiter
    command: caddy reverse-proxy --from ${DOMAIN:-bitte-DOMAIN-in-env-setzen} --to app:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app

  # Automatische Updates: gepflegter Nachfolger von Watchtower (das Original ist seit 12/2025 eingestellt).
  # Nachts, damit kein laufendes Spiel unterbrochen wird. Braucht Zugriff auf den Docker-Socket.
  autoupdate:
    image: nickfedor/watchtower:latest
    profiles: ["autoupdate"]
    restart: unless-stopped
    environment:
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"   # Sekunde Minute Stunde … → täglich 4:00 Uhr
      WATCHTOWER_LABEL_ENABLE: "true"       # nur Container mit dem Label oben
      WATCHTOWER_CLEANUP: "true"            # alte Images aufräumen
      TZ: Europe/Berlin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  manhunt-data:
  caddy-data:
  caddy-config:
