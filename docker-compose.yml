# Auf dem Server reichen diese Datei und eine .env (siehe .env.example).
# Das Image wird fertig von GitHub geladen (ghcr.io); lokal mit Quellcode baut
# docker-compose.override.yml es stattdessen selbst.
#
# Welche Zusatzdienste laufen, steht in der .env unter COMPOSE_PROFILES (Standard: leer = nur die App), z. B.
#   COMPOSE_PROFILES=caddy,autoupdate
# Einen laufenden Zusatzdienst abschalten: aus COMPOSE_PROFILES nehmen und  docker compose rm -sf <dienst>
# Dann genügt immer:  docker compose pull && docker compose up -d
#
#   caddy       eigene Domain mit automatischem HTTPS (Ports 80/443)
#   tunnel      kostenloser Cloudflare-Schnelltunnel ohne Domain (Adresse: docker compose logs tunnel)
#   autoupdate  holt neue Versionen automatisch, täglich um 4 Uhr nachts
# Ohne Profil läuft nur die App auf http://127.0.0.1:3000 (z. B. hinter einem vorhandenen Reverse Proxy).

# Logs aller Dienste begrenzen (max. 3 × 10 MB), damit sie die Platte nicht füllen
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${MANHUNT_IMAGE:-ghcr.io/asamedia/manhunt-web:latest}
    restart: unless-stopped
    init: true
    logging: *logging
    # Abschottung: nur /data ist beschreibbar, keine Sonderrechte
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Bitte ADMIN_PASSWORD in .env setzen}
      SUPERVISOR_PASSWORD: ${SUPERVISOR_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAP_CENTER: ${MAP_CENTER:-}
      TILE_URL: ${TILE_URL:-}
      TILE_ATTRIBUTION: ${TILE_ATTRIBUTION:-}
      AUTO_DELETE_DAYS: ${AUTO_DELETE_DAYS:-7}
      PRIVACY_CONTROLLER: ${PRIVACY_CONTROLLER:-}
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
      PRIVACY_HOSTING: ${PRIVACY_HOSTING:-}
      PRIVACY_OPERATOR: ${PRIVACY_OPERATOR:-}
      MAX_ROOMS_PER_USER: ${MAX_ROOMS_PER_USER:-20}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TILE_PROXY: ${TILE_PROXY:-1}
      TILE_CACHE_MAX_MB: ${TILE_CACHE_MAX_MB:-1000}
      # Die App ist nur über den Proxy (Caddy, Tunnel, eigener Reverse Proxy) erreichbar –
      # die echte Adresse steht im letzten Eintrag von X-Forwarded-For
      TRUST_PROXY: "1"
    labels:
      # nur diesen Container automatisch aktualisieren (Profil autoupdate)
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - manhunt-data:/data
    ports:
      - "127.0.0.1:${LOCAL_PORT:-3000}:3000"

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    logging: *logging
    # Automatisches HTTPS (Let's Encrypt) für DOMAIN, leitet an die App weiter
    command: caddy reverse-proxy --from ${DOMAIN:-bitte-DOMAIN-in-env-setzen} --to app:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *logging
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app

  # Automatische Updates: gepflegter Nachfolger von Watchtower (das Original ist seit 12/2025 eingestellt).
  # Nachts, damit kein laufendes Spiel unterbrochen wird. Braucht Zugriff auf den Docker-Socket.
  # Tipp: während der Klassenfahrt abschalten (autoupdate aus COMPOSE_PROFILES nehmen) – dann ändert sich nichts mehr.
  autoupdate:
    image: nickfedor/watchtower:latest
    profiles: ["autoupdate"]
    restart: unless-stopped
    logging: *logging
    environment:
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"   # Sekunde Minute Stunde … → täglich 4:00 Uhr
      WATCHTOWER_LABEL_ENABLE: "true"       # nur Container mit dem Label oben
      WATCHTOWER_CLEANUP: "true"            # alte Images aufräumen
      TZ: Europe/Berlin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  manhunt-data:
  caddy-data:
  caddy-config:
